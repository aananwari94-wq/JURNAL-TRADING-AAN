<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Trading Spot Crypto</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f172a;color:#f1f5f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:#1e293b;border-radius:12px;padding:12px}
  .lbl{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .val{font-size:20px;font-weight:700}
  .pos{color:#34d399}.neg{color:#f87171}
  input,select{width:100%;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px;color:#fff;font-size:14px}
  input:focus,select:focus{outline:none;border-color:#10b981}
  .card input,.card select{background:#0f172a}
  button{border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;color:#fff;cursor:pointer}
  .primary{background:#059669;width:100%;margin-top:10px}
  .primary:hover{background:#10b981}
  .gray{background:#334155}.gray:hover{background:#475569}
  .toolbar{display:flex;gap:10px;margin:16px 0 10px}
  .toolbar select{flex:1}
  .trade{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pair{font-weight:700}
  .small{font-size:12px;color:#94a3b8}
  .del{background:none;color:#64748b;padding:2px 6px;font-size:18px}
  .del:hover{color:#f87171}
  .sellrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .err{color:#f87171;font-size:12px;margin-top:8px;min-height:14px}
  .empty{text-align:center;color:#64748b;padding:24px 0;font-size:14px}
  .mt{margin-top:10px}
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-left:6px}
  .b-Open{background:#334155;color:#cbd5e1}
  .b-Sebagian{background:#78350f;color:#fcd34d}
  .b-Closed{background:#064e3b;color:#6ee7b7}
  .sellline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#cbd5e1;border-top:1px solid #334155;padding:4px 0}
  .pairbox{border-top:1px solid #334155;padding:10px 0 2px}
  .pairbox:first-of-type{border-top:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>📒 Jurnal Trading Spot</h1>
  <div class="sub">Catat beli &amp; jual (termasuk jual sebagian), fee otomatis. Data tersimpan di browser kamu &amp; Google Sheets.</div>

  <div class="grid2" id="stats"></div>
  <div class="card mt" id="chart"></div>
  <div class="card mt" id="pairsum"></div>

  <div class="card mt">
    <div style="font-weight:700;margin-bottom:10px">➕ Tambah trade</div>
    <div class="grid2">
      <input id="tgl" type="date">
      <input id="pair" placeholder="Pair (BTC/USDT)">
      <select id="buytype">
        <option value="limit">Beli Limit (0,11555%)</option>
        <option value="market">Beli Market (0,26555%)</option>
      </select>
      <select id="selltype">
        <option value="limit">Jual Limit (0,10555%)</option>
        <option value="market">Jual Market (0,25555%)</option>
      </select>
      <input id="entry" type="text" inputmode="decimal" placeholder="Harga entry">
      <input id="exit" type="text" inputmode="decimal" placeholder="Harga exit (kosong = open)">
      <input id="qty" type="text" inputmode="decimal" placeholder="Jumlah koin dibeli">
      <input id="sellqty" type="text" inputmode="decimal" placeholder="Jumlah koin dijual (kosong = semua)">
    </div>
    <input id="catatan" class="mt" placeholder="Catatan / alasan entry">
    <div class="err" id="err"></div>
    <button class="primary" onclick="addTrade()">Simpan trade</button>
  </div>

  <div class="toolbar">
    <select id="filter" onchange="render()"></select>
    <button class="gray" onclick="exportCSV()">⬇️ Ekspor CSV</button>
  </div>

  <div id="list"></div>
</div>

<script>
const KEY = "jurnal-trading:trades";
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqT4AbIiRzHg1hPNYo-wAaCGpmpwyXDxu3qACQcmUXwi3TQLsfhl9rM93hVyfQxkGkfg/exec";

const RATE = {
  buy: { limit: 0.0011555, market: 0.0026555 },
  sell: { limit: 0.0010555, market: 0.0025555 }
};
const TYPE_LBL = { limit: "Limit", market: "Market", lama: "(data lama)" };

const $ = (id) => document.getElementById(id);
const sum = (a) => a.reduce((x, y) => x + y, 0);
const uid = () => "t_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const typeLbl = (x) => TYPE_LBL[x] || "";
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");

// Konversi tanggal aman zona waktu lokal
const cleanDate = (dStr) => {
  if (!dStr) return new Date().toLocaleDateString('sv-SE');
  const s = String(dStr);
  if (s.includes("T")) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
  }
  return s.split("T")[0];
};

const parseNum = (v) => {
  if (v == null || v === "") return 0;
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  const n = Number(String(v).replace(',', '.'));
  return isNaN(n) ? 0 : n;
};

const fmt = (n) => Number(parseNum(n)).toLocaleString("id-ID", { maximumFractionDigits: 2 });
const fmtQty = (n) => Number(parseNum(n)).toLocaleString("id-ID", { maximumFractionDigits: 8 });
const fmtPrice = (n) => {
  n = parseNum(n);
  if (Math.abs(n) < 1) return n.toLocaleString("id-ID", { minimumFractionDigits: 6, maximumFractionDigits: 6 });
  return n.toLocaleString("id-ID", { maximumFractionDigits: 0 });
};

function migrate(t) {
  if (Array.isArray(t.sells)) return { ...t, tgl: cleanDate(t.tgl) };
  const sells = [];
  if (t.exit !== "" && t.exit != null) {
    sells.push({ id: uid(), tgl: cleanDate(t.tgl), price: parseNum(t.exit), qty: parseNum(t.qty), type: "lama", fee: 0 });
  }
  return {
    id: String(t.id), tgl: cleanDate(t.tgl), pair: t.pair, entry: parseNum(t.entry), qty: parseNum(t.qty),
    buyType: "lama", buyFee: parseNum(t.fee || 0), catatan: t.catatan || "", sells: sells
  };
}

let trades = [];
try { trades = (JSON.parse(localStorage.getItem(KEY)) || []).map(migrate); } catch (e) {}
try { localStorage.setItem(KEY, JSON.stringify(trades)); } catch (e) {}

async function syncToCloud(currentTrades) {
  if (!WEB_APP_URL || WEB_APP_URL.includes("MASUKKAN_URL")) return;
  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: "sync", trades: currentTrades })
    });
  } catch (err) {
    console.error("Gagal sinkron ke cloud:", err);
  }
}

async function loadFromCloud() {
  if (!WEB_APP_URL || WEB_APP_URL.includes("MASUKKAN_URL")) return;
  try {
    const res = await fetch(WEB_APP_URL);
    const data = await res.json();
    if (data.status === "success" && Array.isArray(data.trades) && data.trades.length > 0) {
      trades = data.trades.map(migrate);
      localStorage.setItem(KEY, JSON.stringify(trades));
      render();
    }
  } catch (err) {
    console.error("Gagal memuat dari cloud:", err);
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(trades));
  syncToCloud(trades);
  render();
}

function info(t) {
  const tQty = parseNum(t.qty);
  const tEntry = parseNum(t.entry);
  const tBuyFee = parseNum(t.buyFee);

  const sold = +sum(t.sells.map((s) => parseNum(s.qty))).toFixed(12);
  const remaining = +(tQty - sold).toFixed(12);
  const sellFee = sum(t.sells.map((s) => parseNum(s.fee)));
  const gain = sum(t.sells.map((s) => (parseNum(s.price) - tEntry) * parseNum(s.qty)));
  const buyFeePart = tQty ? tBuyFee * (sold / tQty) : 0;
  const pnl = t.sells.length ? gain - sellFee - buyFeePart : null;
  const cost = tEntry * sold;
  const pct = pnl !== null && cost ? (pnl / cost) * 100 : null;
  const status = remaining <= 0 ? "Closed" : sold > 0 ? "Sebagian" : "Open";
  return { sold: sold, remaining: remaining, sellFee: sellFee, pnl: pnl, pct: pct, status: status };
}

function addTrade() {
  const setErr = (m) => { $("err").textContent = m; };
  const pair = $("pair").value.trim().toUpperCase();
  const entry = parseNum($("entry").value);
  const qty = parseNum($("qty").value);
  const exitV = $("exit").value.trim();
  const sellQtyV = $("sellqty").value.trim();

  if (!pair || !entry || !qty) { setErr("Isi minimal: pair, harga entry, dan jumlah koin dibeli."); return; }
  const buyType = $("buytype").value;
  const sellType = $("selltype").value;
  const tgl = cleanDate($("tgl").value || new Date());
  const lot = {
    id: uid(), tgl: tgl, pair: pair, entry: entry, qty: qty,
    buyType: buyType, buyFee: entry * qty * RATE.buy[buyType],
    catatan: $("catatan").value, sells: []
  };
  if (exitV !== "" || sellQtyV !== "") {
    const price = parseNum(exitV);
    if (!price) { setErr("Isi harga exit untuk koin yang dijual."); return; }
    const sq = sellQtyV === "" ? qty : parseNum(sellQtyV);
    if (!(sq > 0) || sq > qty + 1e-12) { setErr("Jumlah dijual harus lebih dari 0 dan tidak boleh melebihi jumlah dibeli."); return; }
    lot.sells.push({ id: uid(), tgl: tgl, price: price, qty: sq, type: sellType, fee: price * sq * RATE.sell[sellType] });
  }
  setErr("");
  trades.unshift(lot);
  ["pair", "entry", "exit", "qty", "sellqty", "catatan"].forEach((i) => ($(i).value = ""));
  save();
}

function sellLot(id) {
  const t = trades.find((x) => String(x.id) === String(id));
  if (!t) return;
  const priceStr = $("p" + id).value.trim();
  const qvStr = $("q" + id).value.trim();
  const type = $("t" + id).value;
  const remaining = info(t).remaining;

  const price = parseNum(priceStr);
  if (!priceStr || !price) { alert("Isi harga exit dulu."); return; }

  const sq = qvStr === "" ? remaining : parseNum(qvStr);
  if (!(sq > 0) || sq > remaining + 1e-12) { alert("Jumlah dijual harus lebih dari 0 dan maksimal " + fmtQty(remaining) + "."); return; }
  t.sells.push({ id: uid(), tgl: cleanDate(new Date()), price: price, qty: sq, type: type, fee: price * sq * RATE.sell[type] });
  save();
}

function delSell(tid, sid) {
  if (!confirm("Hapus catatan penjualan ini?")) return;
  const t = trades.find((x) => String(x.id) === String(tid));
  if (t) t.sells = t.sells.filter((s) => String(s.id) !== String(sid));
  save();
}

function del(id) {
  if (confirm("Hapus trade ini beserta semua penjualannya?")) {
    trades = trades.filter((t) => String(t.id) !== String(id));
    save();
  }
}

function view() {
  const f = $("filter").value;
  return f ? trades.filter((t) => t.pair === f) : trades;
}

function drawChart(curve) {
  if (curve.length < 2) { $("chart").style.display = "none"; return; }
  $("chart").style.display = "block";
  const W = 600, H = 160, P = 10;
  const mn = Math.min(0, ...curve), mx = Math.max(0, ...curve), r = (mx - mn) || 1;
  const x = (i) => P + (i / (curve.length - 1)) * (W - 2 * P);
  const y = (v) => H - P - ((v - mn) / r) * (H - 2 * P);
  const pts = curve.map((v, i) => x(i) + "," + y(v)).join(" ");
  $("chart").innerHTML =
    '<div class="lbl">Kurva P&amp;L kumulatif (per penjualan)</div>' +
    '<svg viewBox="0 0 ' + W + " " + H + '" width="100%">' +
    '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#475569" stroke-dasharray="4"/>' +
    '<polyline fill="none" stroke="#34d399" stroke-width="2.5" points="' + pts + '"/></svg>';
}

function pairSummary(list) {
  const groups = {};
  list.forEach((t) => { (groups[t.pair] = groups[t.pair] || []).push(t); });
  const names = Object.keys(groups).sort();
  if (!names.length) { $("pairsum").style.display = "none"; return; }
  $("pairsum").style.display = "block";
  $("pairsum").innerHTML =
    '<div class="lbl" style="margin-bottom:8px">Ringkasan per pair</div>' +
    names.map((n) => {
      const ts = groups[n];
      const bq = sum(ts.map((t) => parseNum(t.qty)));
      const bv = sum(ts.map((t) => parseNum(t.entry) * parseNum(t.qty)));
      const sells = [].concat.apply([], ts.map((t) => t.sells));
      const sq = sum(sells.map((s) => parseNum(s.qty)));
      const sv = sum(sells.map((s) => parseNum(s.price) * parseNum(s.qty)));
      const fb = sum(ts.map((t) => parseNum(t.buyFee)));
      const fs = sum(sells.map((s) => parseNum(s.fee)));
      return '<div class="pairbox"><div class="pair" style="margin-bottom:6px">' + esc(n) + '</div><div class="grid2">' +
        '<div><div class="lbl">Rata-rata beli</div><b>' + (bq ? fmtPrice(bv / bq) : "-") + '</b><div class="small">Total beli ' + fmtQty(bq) + "</div></div>" +
        '<div><div class="lbl">Rata-rata jual</div><b>' + (sq ? fmtPrice(sv / sq) : "-") + '</b><div class="small">Total jual ' + fmtQty(sq) + "</div></div>" +
        '<div><div class="lbl">Fee beli</div><b>' + fmt(fb) + "</b></div>" +
        '<div><div class="lbl">Fee jual</div><b>' + fmt(fs) + "</b></div>" +
        "</div></div>";
    }).join("");
}

function render() {
  const pairs = [...new Set(trades.map((t) => t.pair))].sort();
  const sel = $("filter");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Semua pair</option>' + pairs.map((p) => "<option>" + esc(p) + "</option>").join("");
  sel.value = pairs.indexOf(cur) >= 0 ? cur : "";

  const list = view();
  const infos = list.map((t) => ({ t: t, i: info(t) }));
  const pnls = infos.filter((x) => x.i.pnl !== null).map((x) => x.i.pnl);
  const total = sum(pnls);
  const wins = pnls.filter((p) => p > 0).length;
  const winrate = pnls.length ? (wins / pnls.length) * 100 : 0;
  const best = pnls.length ? Math.max(...pnls) : 0;
  const worst = pnls.length ? Math.min(...pnls) : 0;
  const openCount = infos.filter((x) => x.i.status !== "Closed").length;
  const feeBuy = sum(list.map((t) => parseNum(t.buyFee)));
  const feeSell = sum(infos.map((x) => x.i.sellFee));

  $("stats").innerHTML =
    '<div class="card"><div class="lbl">Total P&amp;L (realisasi)</div><div class="val ' + cls(total) + '">' + fmt(total) + "</div></div>" +
    '<div class="card"><div class="lbl">Win rate</div><div class="val">' + fmt(winrate) + "%</div></div>" +
    '<div class="card"><div class="lbl">Trade (belum tuntas)</div><div class="val">' + list.length + ' <span class="small">(' + openCount + ")</span></div></div>" +
    '<div class="card"><div class="lbl">Terbaik / Terburuk</div><div style="font-weight:700"><span class="' + cls(best) + '">' + fmt(best) + '</span> / <span class="' + cls(worst) + '">' + fmt(worst) + "</span></div></div>" +
    '<div class="card"><div class="lbl">Total fee beli</div><div class="val">' + fmt(feeBuy) + "</div></div>" +
    '<div class="card"><div class="lbl">Total fee jual</div><div class="val">' + fmt(feeSell) + "</div></div>";

  const ev = [];
  list.forEach((t) => t.sells.forEach((s) => {
    const ePrice = parseNum(t.entry);
    const sPrice = parseNum(s.price);
    const sQty = parseNum(s.qty);
    const sFee = parseNum(s.fee);
    const tQty = parseNum(t.qty);
    const tBuyFee = parseNum(t.buyFee);
    ev.push({ d: cleanDate(s.tgl), id: s.id, v: (sPrice - ePrice) * sQty - sFee - (tQty ? (tBuyFee * sQty) / tQty : 0) });
  }));
  ev.sort((a, b) => String(a.d).localeCompare(String(b.d)) || String(a.id).localeCompare(String(b.id)));
  let run = 0;
  drawChart(ev.map((e) => (run += e.v)));

  pairSummary(list);

  if (!list.length) {
    $("list").innerHTML = '<div class="empty">Belum ada trade. Tambahkan yang pertama di atas.</div>';
    return;
  }
  $("list").innerHTML = infos.map((x) => {
    const t = x.t, i = x.i;
    let html = '<div class="trade"><div class="row"><div>' +
      '<div class="pair">' + esc(t.pair) + ' <span class="small" style="font-weight:400">' + esc(cleanDate(t.tgl)) + "</span>" +
      '<span class="badge b-' + i.status + '">' + i.status + "</span></div>" +
      '<div class="small">Beli ' + typeLbl(t.buyType) + " · Entry " + fmtPrice(t.entry) + " · Qty " + fmtQty(t.qty) + " · Fee beli " + fmt(t.buyFee) + "</div>" +
      '<div class="small">Terjual ' + fmtQty(i.sold) + " · Sisa " + fmtQty(i.remaining) + "</div></div>" +
      '<button class="del" onclick="del(\'' + t.id + '\')">🗑</button></div>';

    if (t.sells.length) {
      html += '<div class="mt">' + t.sells.map((s) =>
        '<div class="sellline"><span>Jual ' + typeLbl(s.type) + " " + fmtQty(s.qty) + " @ " + fmtPrice(s.price) + " · fee " + fmt(s.fee) + " · " + esc(cleanDate(s.tgl)) + "</span>" +
        '<button class="del" onclick="delSell(\'' + t.id + '\', \'' + s.id + '\')">×</button></div>').join("") + "</div>";
    }
    if (i.pnl !== null) {
      html += '<div class="mt ' + cls(i.pnl) + '" style="font-weight:700">' + (i.pnl >= 0 ? "▲ " : "▼ ") + fmt(i.pnl) +
        (i.pct !== null ? " (" + fmt(i.pct) + "%)" : "") + ' <span class="small" style="font-weight:400">P&amp;L realisasi</span></div>';
    }
    if (i.remaining > 0) {
      html += '<div class="sellrow">' +
        '<input id="p' + t.id + '" type="text" inputmode="decimal" placeholder="Harga exit untuk menutup">' +
        '<input id="q' + t.id + '" type="text" inputmode="decimal" placeholder="Jumlah dijual (kosong = semua)">' +
        '<select id="t' + t.id + '"><option value="limit">Jual Limit (0,10555%)</option><option value="market">Jual Market (0,25555%)</option></select>' +
        '<button class="gray" onclick="sellLot(\'' + t.id + '\')">Jual</button></div>';
    }
    if (t.catatan) html += '<div class="small mt">📝 ' + esc(t.catatan) + "</div>";
    return html + "</div>";
  }).join("");
}

function exportCSV() {
  const rows = [["Tanggal", "Pair", "Tipe Beli", "Entry", "Qty Beli", "Fee Beli", "Qty Terjual", "Rata2 Jual", "Fee Jual", "Sisa Qty", "PnL Realisasi", "PnL %", "Status", "Catatan"]];
  view().forEach((t) => {
    const i = info(t);
    const sq = sum(t.sells.map((s) => parseNum(s.qty)));
    const sv = sum(t.sells.map((s) => parseNum(s.price) * parseNum(s.qty)));
    rows.push([
      cleanDate(t.tgl), t.pair, typeLbl(t.buyType), parseNum(t.entry), parseNum(t.qty), parseNum(t.buyFee).toFixed(2),
      i.sold, sq ? +(sv / sq).toFixed(8) : "", i.sellFee.toFixed(2), i.remaining,
      i.pnl === null ? "" : i.pnl.toFixed(2),
      i.pct === null ? "" : i.pct.toFixed(2),
      i.status, t.catatan
    ]);
  });
  const csv = rows.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "jurnal-trading-" + cleanDate(new Date()) + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$("tgl").value = cleanDate(new Date());
render();
loadFromCloud();
</script>
</body>
</html>
